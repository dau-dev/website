<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="author" content="dau.dev" />
    <meta name="theme-color" content="#eeede9" />
    <script>
      try {
        const savedTheme = localStorage.getItem('dau-branding.theme');
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#202021' : '#eeede9');
      } catch {
        // Use the light theme when browser storage is unavailable.
      }
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/img/dau-mark.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://dau.dev/#organization",
            "name": "dau",
            "alternateName": "DAU",
            "url": "https://dau.dev/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://dau.dev/img/dau-mark.png",
              "contentUrl": "https://dau.dev/img/dau-mark.png",
              "width": 512,
              "height": 512
            },
            "description": "dau builds workload-shaped FPGA acceleration for Polars, dataframe, time-series, and analytical computing.",
            "email": "dev@1kbgz.com",
            "sameAs": ["https://github.com/dau-dev"]
          },
          {
            "@type": "WebSite",
            "@id": "https://dau.dev/#website",
            "url": "https://dau.dev/",
            "name": "dau",
            "alternateName": "DAU",
            "description": "Workload-shaped FPGA acceleration for analytical data.",
            "inLanguage": "en",
            "publisher": { "@id": "https://dau.dev/#organization" }
          }
        ]
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
