name: Build Status

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site links the brand kit as a sibling (file:../dau-branding) instead
      # of pulling it from npm; check it out beside the site and build dist/.
      - name: Checkout dau-branding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dau-dev/dau-branding
          path: _dau-branding
          persist-credentials: false

      - name: Position dau-branding as a sibling
        run: mv "$GITHUB_WORKSPACE/_dau-branding" "$(dirname "$GITHUB_WORKSPACE")/dau-branding"

      - name: Setup Node.js
        uses: actions-ext/node/setup@8bcebee998923fcc26f5854b4fd05ea378b58262
        with:
          version: 22.x
          js_folder: .
      - run: pnpm install
        working-directory: ../dau-branding
      - run: pnpm build
        working-directory: ../dau-branding
      - run: pnpm install
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: '1'
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
